name: splurter_android
description: Splurter Android app
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.6
  firebase_messaging: ^15.2.4
  google_sign_in: ^6.2.2
  flutter_riverpod: ^2.6.1

  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^7.0.0
  workmanager: ^0.9.0+3
  path_provider: ^2.1.5
  path: ^1.9.1
  mobile_scanner: ^7.0.0
  uuid: ^4.5.2

  shared_types:
    path: ../../packages/shared_types
  continuity_core:
    path: ../../packages/continuity_core
  continuity_api:
    path: ../../packages/continuity_api
  continuity_state:
    path: ../../packages/continuity_state
  platform_bindings:
    path: ../../packages/platform_bindings
  continuity_ui:
    path: ../../packages/continuity_ui

dependency_overrides:
  shared_types:
    path: ../../packages/shared_types
  continuity_core:
    path: ../../packages/continuity_core
  continuity_api:
    path: ../../packages/continuity_api
  continuity_state:
    path: ../../packages/continuity_state
  platform_bindings:
    path: ../../packages/platform_bindings
  continuity_ui:
    path: ../../packages/continuity_ui



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
